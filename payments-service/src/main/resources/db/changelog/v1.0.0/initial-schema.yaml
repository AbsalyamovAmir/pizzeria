databaseChangeLog:
  - changeSet:
      id: 1
      author: amir
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: product_price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: product_quantity
                  type: INTEGER
                  constraints:
                    nullable: false